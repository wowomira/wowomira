<svg width="1280" height="240" viewBox="0 0 1280 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">WoWo — Network and Security Tooling</title>
  <desc id="desc">A dark navy developer banner with a subtle network graph and the text WoWo, Network and Security Tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1728"/>
      <stop offset="1" stop-color="#0B2230"/>
